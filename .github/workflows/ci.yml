name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_PASSWORD: ci-only-database-password
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-only-administrator-password
      SESSION_COOKIE_SECURE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify Maven build
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Verify legacy database upgrade
        shell: pwsh
        run: ./scripts/test-legacy-upgrade.ps1

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build production image
        run: docker compose build --pull app

      - name: Run integration smoke test
        shell: pwsh
        run: |
          docker compose up --detach --wait --wait-timeout 180
          ./scripts/smoke-test.ps1

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Remove integration containers
        if: always()
        run: docker compose down --volumes --remove-orphans
