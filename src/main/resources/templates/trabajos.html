<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Trabajos | FRIO POLAR</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/styles.css}"></head><body><div th:replace="~{fragments :: header}"></div><main><section class="page-hero"><div class="container"><span class="eyebrow">PORTFOLIO</span><h1>Trabajos realizados</h1><p>Conocé algunas de nuestras instalaciones, mantenimientos y reparaciones.</p></div></section><section class="section"><div class="container"><div class="works-grid"><article class="work-card" th:each="trabajo : ${trabajos}"><img th:src="${trabajo.imagenUrl}" th:alt="${trabajo.titulo}"><div class="work-body"><div class="meta"><span class="tag" th:text="${trabajo.tipoServicio}"></span><time th:text="${#temporals.format(trabajo.fecha, 'dd/MM/yyyy')}"></time></div><h2 th:text="${trabajo.titulo}"></h2><p>⌖ <span th:text="${trabajo.ubicacion}"></span></p><a th:href="@{/trabajos/{id}(id=${trabajo.id})}">Ver detalle →</a></div></article></div><div class="empty" th:if="${#lists.isEmpty(trabajos)}">Todavía no hay trabajos publicados.</div></div></section></main><div th:replace="~{fragments :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
