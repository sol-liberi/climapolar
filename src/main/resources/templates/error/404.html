<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/jpeg" th:href="@{/img/logo-pestana.jpeg(v='20260818')}">
    <meta name="robots" content="noindex">
    <title>Página no encontrada | CLIMA POLAR</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css(v='20260818')}">
    <link rel="stylesheet" th:href="@{/css/brand.css(v='20260817')}">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>
<main class="error-page">
    <section class="error-card" aria-labelledby="error-title">
        <span class="error-code" aria-hidden="true">404</span>
        <span class="eyebrow">PÁGINA NO ENCONTRADA</span>
        <h1 id="error-title">Este enlace no está disponible</h1>
        <p>Es posible que el trabajo haya sido eliminado o que la dirección no sea correcta.</p>
        <a class="btn btn-primary btn-lg" th:href="@{/trabajos}">Ver nuestros trabajos</a>
    </section>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
