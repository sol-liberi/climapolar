<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${trabajo.titulo + ' | FRIO POLAR'}"></title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/styles.css}"></head><body><div th:replace="~{fragments :: header}"></div><main class="detail"><div class="container"><a class="back" th:href="@{/trabajos}">← Volver a trabajos</a><div class="detail-grid"><div><img class="detail-image" th:src="${trabajo.imagenUrl}" th:alt="${trabajo.titulo}"><div class="video" th:if="${trabajo.videoUrl != null and !#strings.isEmpty(trabajo.videoUrl)}"><h2>Video del trabajo</h2><a th:href="${trabajo.videoUrl}" target="_blank" rel="noopener">Ver video ↗</a></div></div><article class="detail-content"><span class="tag" th:text="${trabajo.tipoServicio}"></span><h1 th:text="${trabajo.titulo}"></h1><div class="detail-meta"><span>⌖ <b th:text="${trabajo.ubicacion}"></b></span><span>Fecha <b th:text="${#temporals.format(trabajo.fecha, 'dd/MM/yyyy')}"></b></span></div><p th:text="${trabajo.descripcion}"></p><a class="btn btn-primary btn-lg w-100" href="https://wa.me/5491100000000?text=Hola%20FRIO%20POLAR,%20quiero%20consultar%20por%20un%20trabajo%20similar" target="_blank">Quiero consultar por un trabajo similar</a></article></div></div></main><div th:replace="~{fragments :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
