<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${trabajo.titulo + ' | CLIMA POLAR'}"></title>
    <meta name="description" th:content="${trabajo.descripcion}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css(v='20260817')}">
    <link rel="stylesheet" th:href="@{/css/brand.css(v='20260817')}">
    <link rel="stylesheet" th:href="@{/css/works.css(v='20260817')}">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>
<main class="detail">
    <div class="container">
        <a class="back" th:href="@{/trabajos}">← Volver a trabajos</a>
        <div class="detail-grid">
            <div>
                <div class="work-gallery" th:classappend="${#lists.size(trabajo.medios) == 1} ? ' work-gallery--single'"
                     th:if="${!#lists.isEmpty(trabajo.medios)}">
                    <figure class="work-gallery-item" th:each="medio, estado : ${trabajo.medios}">
                        <button class="lightbox-trigger" type="button"
                                th:if="${medio.imagen}"
                                th:data-full-src="${medio.rutaPublica}"
                                th:data-alt="${trabajo.titulo + ' — fotografía ' + estado.count}"
                                th:aria-label="${'Ampliar fotografía ' + estado.count + ' de ' + trabajo.titulo}">
                            <img th:src="${medio.miniaturaOOriginal}"
                                 th:alt="${trabajo.titulo + ' — fotografía ' + estado.count}"
                                 th:fetchpriority="${estado.first} ? 'high' : 'auto'"
                                 th:loading="${estado.first} ? 'eager' : 'lazy'"
                                 decoding="async">
                        </button>
                        <video class="detail-video" th:if="${medio.video}" controls preload="none" playsinline
                               th:aria-label="${'Video de ' + trabajo.titulo}">
                            <source th:src="${medio.rutaPublica}" th:type="${medio.contentType}">
                            Tu navegador no puede reproducir este video.
                        </video>
                    </figure>
                </div>
                <div class="feed-state" th:if="${#lists.isEmpty(trabajo.medios)}">Este trabajo todavía no tiene archivos publicados.</div>
            </div>

            <article class="detail-content">
                <span class="tag" th:text="${trabajo.categoria.etiqueta}"></span>
                <h1 th:text="${trabajo.titulo}"></h1>
                <div class="detail-meta">
                    <span th:if="${trabajo.ubicacion != null and !#strings.isEmpty(trabajo.ubicacion) and trabajo.ubicacion != '—'}">Ubicación <b th:text="${trabajo.ubicacion}"></b></span>
                    <span>Fecha <b th:text="${#temporals.format(trabajo.fecha, 'dd/MM/yyyy')}"></b></span>
                </div>
                <p th:text="${trabajo.descripcion}"></p>
                <a class="btn btn-primary btn-lg w-100" href="https://wa.me/5491169817333?text=Hola%20CLIMA%20POLAR,%20quiero%20consultar%20por%20un%20trabajo%20similar" target="_blank" rel="noopener">Consultar por un trabajo similar</a>
            </article>
        </div>
    </div>
</main>

<dialog id="mediaLightbox" class="media-lightbox" aria-label="Fotografía ampliada">
    <button class="media-lightbox-close" type="button" data-lightbox-close aria-label="Cerrar fotografía">×</button>
    <figure class="media-lightbox-figure">
        <img id="lightboxImage" alt="">
        <figcaption id="lightboxCaption"></figcaption>
    </figure>
</dialog>

<div th:replace="~{fragments :: footer}"></div>
<script th:src="@{/js/trabajo-detalle.js(v='20260817')}" defer></script>
</body>
</html>
