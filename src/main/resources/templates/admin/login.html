<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/jpeg" th:href="@{/img/logo-pestana.jpeg(v='20260818')}">
    <title>Ingresar al panel | CLIMA POLAR</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css(v='20260818')}">
    <link rel="stylesheet" th:href="@{/css/brand.css(v='20260817')}">
    <link rel="stylesheet" th:href="@{/css/admin.css(v='20260817')}">
</head>
<body class="admin-page admin-login-page">
<main class="admin-login-card">
    <a class="brand-logo admin-login-logo" th:href="@{/}" aria-label="CLIMA POLAR Refrigeración - Inicio">
        <img th:src="@{/img/logo-clima-polar.jpeg}" width="827" height="422" alt="CLIMA POLAR Refrigeración">
    </a>
    <span class="eyebrow">ACCESO PRIVADO</span>
    <h1>Administración</h1>
    <p>Ingresá para publicar y gestionar los trabajos de CLIMA POLAR.</p>

    <div class="alert alert-danger" th:if="${param.error}">Los datos ingresados no son correctos.</div>
    <div class="alert alert-success" th:if="${param.logout}">La sesión se cerró correctamente.</div>

    <form class="admin-login-form" th:action="@{/admin/login}" method="post">
        <div>
            <label for="username">Usuario</label>
            <input id="username" class="form-control" name="username" type="text" autocomplete="username" required autofocus>
        </div>
        <div>
            <label for="password">Contraseña</label>
            <input id="password" class="form-control" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-lg w-100" type="submit">Ingresar al panel</button>
    </form>
    <a class="admin-login-back" th:href="@{/}">← Volver al sitio</a>
</main>
</body>
</html>
