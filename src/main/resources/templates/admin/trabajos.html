<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Administrar trabajos | FRIO POLAR</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/styles.css}"></head><body class="admin-page"><header class="admin-header"><div class="container"><a class="brand" th:href="@{/}"><span>FRIO</span> POLAR</a><a th:href="@{/}" target="_blank">Ver sitio ↗</a></div></header><main class="container admin-main"><div class="admin-title"><div><span class="eyebrow">PANEL ADMINISTRATIVO</span><h1>Trabajos</h1><p>Gestioná el portfolio publicado en el sitio.</p></div><a class="btn btn-primary btn-lg" th:href="@{/admin/trabajos/nuevo}">+ Nuevo trabajo</a></div><div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Trabajo</th><th>Servicio</th><th>Ubicación</th><th>Fecha</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="trabajo : ${trabajos}"><td><div class="admin-work"><img th:src="${trabajo.imagenUrl}" alt=""><b th:text="${trabajo.titulo}"></b></div></td><td th:text="${trabajo.tipoServicio}"></td><td th:text="${trabajo.ubicacion}"></td><td th:text="${#temporals.format(trabajo.fecha, 'dd/MM/yyyy')}"></td><td><span class="featured" th:if="${trabajo.destacado}">Destacado</span><span th:unless="${trabajo.destacado}">Publicado</span></td><td class="actions"><a th:href="@{/admin/trabajos/editar/{id}(id=${trabajo.id})}">Editar</a><form th:action="@{/admin/trabajos/eliminar/{id}(id=${trabajo.id})}" method="post" onsubmit="return confirm('¿Eliminar este trabajo?')"><button type="submit">Eliminar</button></form></td></tr></tbody></table><div class="empty" th:if="${#lists.isEmpty(trabajos)}">No hay trabajos cargados.</div></div></main></body></html>
