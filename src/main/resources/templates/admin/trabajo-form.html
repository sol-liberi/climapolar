<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${tituloPagina + ' | FRIO POLAR'}"></title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/styles.css}"></head><body class="admin-page"><header class="admin-header"><div class="container"><a class="brand" th:href="@{/}"><span>FRIO</span> POLAR</a><a th:href="@{/admin/trabajos}">← Volver al listado</a></div></header><main class="container form-page"><span class="eyebrow">PANEL ADMINISTRATIVO</span><h1 th:text="${tituloPagina}"></h1><p>Completá la información que se mostrará en el portfolio.</p><form class="work-form" th:action="@{/admin/trabajos/guardar}" th:object="${trabajo}" method="post"><input type="hidden" th:field="*{id}"><div class="form-grid"><div class="full"><label for="titulo">Título *</label><input id="titulo" class="form-control" th:field="*{titulo}" placeholder="Ej: Instalación Split 4500 frigorías"><small class="field-error" th:errors="*{titulo}"></small></div><div class="full"><label for="descripcion">Descripción *</label><textarea id="descripcion" class="form-control" rows="5" th:field="*{descripcion}" placeholder="Contá brevemente cómo se realizó el trabajo"></textarea><small class="field-error" th:errors="*{descripcion}"></small></div><div><label for="tipo">Tipo de servicio *</label><select id="tipo" class="form-select" th:field="*{tipoServicio}"><option value="">Seleccionar</option><option>Instalación</option><option>Mantenimiento</option><option>Limpieza</option><option>Reparación</option><option>Desinstalación</option><option>Reinstalación</option><option>Diagnóstico técnico</option></select><small class="field-error" th:errors="*{tipoServicio}"></small></div><div><label for="ubicacion">Ubicación *</label><input id="ubicacion" class="form-control" th:field="*{ubicacion}" placeholder="Ej: Villa Devoto"><small class="field-error" th:errors="*{ubicacion}"></small></div><div><label for="fecha">Fecha *</label><input id="fecha" type="date" class="form-control" th:field="*{fecha}"><small class="field-error" th:errors="*{fecha}"></small></div><div class="check-field"><input id="destacado" type="checkbox" th:field="*{destacado}"><label for="destacado">Mostrar como destacado en la página de inicio</label></div><div class="full"><label for="imagen">URL de imagen *</label><input id="imagen" type="url" class="form-control" th:field="*{imagenUrl}" placeholder="https://..."><small class="field-error" th:errors="*{imagenUrl}"></small></div><div class="full"><label for="video">URL de video <span>(opcional)</span></label><input id="video" type="url" class="form-control" th:field="*{videoUrl}" placeholder="https://..."></div></div><div class="form-actions"><a class="btn btn-outline-secondary" th:href="@{/admin/trabajos}">Cancelar</a><button class="btn btn-primary" type="submit">Guardar trabajo</button></div></form></main></body></html>
