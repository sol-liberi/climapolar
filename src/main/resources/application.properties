spring.application.name=frio-polar
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=24
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.web.resources.cache.period=${STATIC_CACHE_PERIOD:1h}
spring.web.locale=es_AR
spring.web.locale-resolver=fixed

climapolar.admin.username=${ADMIN_USERNAME:}
climapolar.admin.password=${ADMIN_PASSWORD:}
climapolar.media.upload-dir=${UPLOAD_DIR:./data/media}
climapolar.security.trusted-proxies=${CLIMAPOLAR_SECURITY_TRUSTED_PROXIES:127.0.0.1,::1}

spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=180MB
spring.servlet.multipart.file-size-threshold=0
spring.servlet.multipart.resolve-lazily=true

server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${climapolar.security.trusted-proxies}
server.tomcat.use-relative-redirects=true
server.tomcat.max-http-form-post-size=16KB
server.tomcat.max-parameter-count=100
server.tomcat.max-part-count=64
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
